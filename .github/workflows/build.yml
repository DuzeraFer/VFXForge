name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Golden-image tests (software WebGPU)
        run: npm run test:golden
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: golden-failed
          path: tests/golden/failed
          if-no-files-found: ignore

  windows-portable:
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: VFXForge-portable
          path: release/*.exe
          if-no-files-found: error
